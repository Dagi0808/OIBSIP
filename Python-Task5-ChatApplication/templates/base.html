<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ChatApp{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f10; --sidebar: #171718; --panel: #1e1e20;
      --border: #2e2e30; --primary: #5865f2; --primary-hover: #4752c4;
      --text: #dcddde; --muted: #72767d; --input-bg: #2f3136;
      --green: #3ba55c; --red: #ed4245; --mention: #faa61a;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: var(--bg); color: var(--text); min-height: 100vh; }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
    input, textarea, button { font-family: inherit; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
